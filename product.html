<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de producto | Smart UdeSA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>

    <header>

        <a class="logo" href="./index.html">
            <img src="./img/logo-smart.png" alt="Smart UdeSA">
        </a>

        <form class="buscador" action="./search-results.html" method="GET">
            <div>
                <label for="busqueda">Buscar:</label>
                <input id="busqueda" type="text" name="busqueda" value="" placeholder="Buscar un auto">
            </div>
            <div>
                <button type="submit">Buscar</button>
            </div>
            <p class="error-buscador"></p>
        </form>

        <nav class="menu-principal">
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li class="item-login"><a href="./login.html">Login</a></li>
                <li class="item-register"><a href="./register.html">Register</a></li>
                <li class="item-bienvenida"></li>
                <li class="item-logout"><a href="#">Logout</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <aside>

            <nav class="nav-categorias">

                <h2>Categorias</h2>

                <ul class="menu-categorias">
                </ul>

            </nav>

        </aside>

        <div class="contenido-producto">

            <section class="detalle-producto">

                <img src="" alt="">

                <article class="info-producto">
                    <h1></h1>
                    <p class="marca"></p>
                    <p class="categoria-producto"></p>
                    <p class="descripcion"></p>
                    <p class="precio"></p>
                    <p class="stock"></p>
                    <ul class="tags">
                    </ul>
                </article>

            </section>

            <section class="reviews">

                <h2>Reviews</h2>

            </section>

        </div>

    </main>

    <footer>

        <p>Smart UdeSA</p>

        <h2>Integrantes del equipo</h2>

        <ul class="integrantes">
            <li>Iván Lebenglik</li>
            <li>Tomás Andrés</li>
            <li>Bernardo Sánchez</li>
        </ul>

    </footer>
    <script src="./js/product.js"></script>
    <script src="./js/saludo.js"></script>
    <script src="./js/logout.js"></script>
    <script src="./js/buscador.js"></script>
    <script src="./js/categorias.js"></script>
</body>

</html>
