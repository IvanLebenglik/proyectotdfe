<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart UdeSA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header>
        <a class="logo" href="./index.html">
            <img src="./img/logo-smart.png" alt="Smart UdeSA">
        </a>
        <nav class="menu-principal">
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./login.html">Login</a></li>
                <li><a href="./register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main class="formulario-centrado">
        <form class="login" action="./index.html" method="GET">
            <h3>Login</h3>
            <div class="login-field">
                <label for="email">Email:</label>
                <input id="email" type="email" name="email" value="">
            </div>
            <div class="login-field">
                <label for="password">Contraseña:</label>
                <input id="password" type="password" name="password" value="">
            </div>
            <div class="login-accion">
                <button class="button" type="submit">Ingresar</button>
            </div>
            <div class="login-accion">
                <a href="./register.html">No tengo cuenta</a>
            </div>
        </form>
    </main>

    <footer>

        <p>Smart UdeSA</p>

        <h2>Integrantes del equipo</h2>

        <ul class="integrantes">
            <li>Iván Lebenglik</li>
            <li>Tomás Andrés</li>
            <li>Bernardo Sánchez</li>
        </ul>

    </footer>
</body>
</html>
