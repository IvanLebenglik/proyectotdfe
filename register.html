<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Smart UdeSA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

    <header>

        <a class="logo" href="./index.html">
            <img src="./img/logo-smart.png" alt="Smart UdeSA">
        </a>

        <form class="buscador" action="./search-results.html" method="GET">
            <div>
                <label for="busqueda">Buscar:</label>
                <input id="busqueda" type="text" name="busqueda" value="" placeholder="Buscar un producto">
            </div>
            <div>
                <button type="submit">Buscar</button>
            </div>
            <p class="error-buscador"></p>
        </form>

        <nav class="menu-principal">
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li class="item-login"><a href="./login.html">Login</a></li>
                <li class="item-register"><a href="./register.html">Register</a></li>
                <li class="item-bienvenida"></li>
                <li class="item-logout"><a href="#">Logout</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <aside>

            <nav class="nav-categorias">

                <h2>Categorias</h2>

                <ul class="menu-categorias">
                </ul>

            </nav>

        </aside>

        <section class="formulario-centrado">
            <h3>Register</h3>
            <form class="register" action="./login.html" method="GET" >
                <div class="register-field">
                    <label for="email">Email:</label>
                    <input id="email" type="email" name="email" value="" >
                </div>
                <div class="register-field">
                    <label for="password">Contraseña:</label>
                    <input id="password" type="password" name="password" value="" >
                </div>
                <div class="register-field">
                    <label for="repetir-password">Repetir Contraseña:</label>
                    <input id="repetir-password" type="password" name="repetir-password" value="">
                </div>
                <div class="register-accion">
                    <p id="error-register"></p>
                    <button class="button" type="submit">Registrarme</button>
                </div>
                <div class="register-accion">
                    <label for="terminos">Acepto términos y condiciones</label>
                    <input id="terminos" type="checkbox" name="terminos" value="acepto">
                </div>
            </form>
            <a href="./login.html">Ya tengo una cuenta</a>
        </section>

    </main>

    <footer>

        <p>Smart UdeSA</p>

        <h2>Integrantes del equipo</h2>

        <ul class="integrantes">
            <li>Iván Lebenglik</li>
            <li>Tomás Andrés</li>
            <li>Bernardo Sánchez</li>
        </ul>

    </footer>
    <script src="./js/register.js"></script>
    <script src="./js/saludo.js"></script>
    <script src="./js/logout.js"></script>
    <script src="./js/buscador.js"></script>
    <script src="./js/categorias.js"></script>
</body>
</html>
